name: Fetch Data

on:
  schedule:
    # Run daily at 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch.yml'

jobs:
  fetch-data:
    name: Fetch China Sanctions Data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Fetch data
        id: fetch
        run: |
          set -euo pipefail
          # Do not ask the gem to fetch a source it declares it cannot fetch.
          #
          # `FETCHABLE_SOURCES` is `ALL_SOURCES - %i[cn ru jp]`
          # (lib/ammitto/config/defaults.rb:72): China's lists need HTML
          # parsing from mofcom.gov.cn and mfa.gov.cn, cn is excluded by
          # design, and the extractor refuses rather than report an empty
          # scrape as success. The refusal is NOT distinguishable from a real
          # failure by exit status -- `fetch_command.rb:856` converts every
          # error into one Thor::Error, so a genuine fault on a SUPPORTED
          # source exits 1 as well.
          #
          # Until now this did not get that far: the command was unqualified,
          # the gem is not on PATH in this job, and every run since at least
          # 2026-08-28 logged `ammitto: command not found` -- exit 127,
          # swallowed by `|| true`, reported as success. The daily green tick
          # meant only that bash had reached the end of the line.
          #
          # So: ask whether the source is fetchable, and only then fetch. When
          # it is not, say so and commit nothing. When it becomes fetchable,
          # every nonzero exit fails this step, `failure()` turns true and the
          # issue below is filed.
          # The probe answers with a distinct status for each outcome, so a
          # broken probe -- a LoadError, a bundler fault, a gem that did not
          # install -- cannot be read as "not fetchable" and go green. Only
          # 10 and 20 are answers; anything else is a fault and fails the step.
          set +e
          bundle exec ruby -e 'require "ammitto"; exit(Ammitto::Config::Defaults::FETCHABLE_SOURCES.include?(:cn) ? 10 : 20)'
          probe=$?
          set -e

          case "$probe" in
            10)
              bundle exec ammitto fetch cn --format yaml --output-dir processed --verbose
              echo "succeeded=true" >> "$GITHUB_OUTPUT"
              ;;
            20)
              echo "succeeded=false" >> "$GITHUB_OUTPUT"
              echo "cn is not in FETCHABLE_SOURCES; nothing fetched, nothing to commit."
              ;;
            *)
              echo "::error::fetchability probe exited $probe; it answers 10 or 20"
              exit 1
              ;;
          esac

      - name: Check for changes
        id: check_changes
        run: |
          set -euo pipefail
          # Assign first. Inside `[ -z "$(git status)" ]` a failing git
          # yields an empty string, which reads as "no changes" and exits
          # 0 -- another quiet no-commit path, which is what this file is
          # about. Under `set -e` a failed assignment fails the step.
          # Scoped to processed/, because that is all the commit stages. A
          # repo-wide check would report a change elsewhere and then fail the
          # commit with "nothing to commit".
          changes="$(git status --porcelain -- processed/)"
          if [ -z "$changes" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.fetch.outputs.succeeded == 'true' &&
          steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A fetch writes processed/ and nothing else. Staging the whole
          # checkout would let an unrelated eligible file ride along on a
          # harvest commit.
          git add -A -- processed/
          git commit -m "chore: update China sanctions data ($(date +%Y-%m-%d))"
          git push

      # `failure()` is true only when an earlier step actually failed. Probe
      # status 20 is the expected "CN is not in FETCHABLE_SOURCES" result: the
      # fetch step skips cleanly, sets succeeded=false, and the workflow files
      # no issue. Unexpected probe statuses and any real fetch failure exit
      # nonzero, so this condition files the issue on the default branch; it
      # needs no change when CN becomes fetchable.
      - name: Create issue on failure
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Fetch failed - ${{ github.run_id }}',
              body: 'The fetch workflow failed. See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              labels: ['automation', 'fetch']
            })
